  <path d="M 120 190 C 147 190, 153 162.2, 180 162.2" class="wire"/>
  <path d="M 120 120 C 147 120, 153 217.8, 180 217.8" class="wire"/>
  <path d="M 120 260 C 147 260, 145 232.2, 172 232.2" class="wire-inv"/>
  <circle cx="176" cy="232.2" r="3.5" class="bubble"/>
  <path d="M 230 155 C 270.5 155, 279.5 155, 320 155" class="wire"/>
  <path d="M 230 225 C 270.5 225, 271.5 225, 312 225" class="wire-inv"/>
  <circle cx="316" cy="225" r="3.5" class="bubble"/>
  <rect x="40" y="102" width="80" height="36" class="gate-in"/>
