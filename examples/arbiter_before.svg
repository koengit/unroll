  <rect x="40" y="172" width="80" height="36" class="gate-in"/>
  <text x="80" y="190" class="lbl">B</text>
  <ellipse cx="205" cy="155" rx="25" ry="18" class="gate-and"/>
  <text x="205" y="153" class="lbl" font-weight="bold">&amp;</text>
  <text x="205" y="165" class="sublbl">#4</text>
  <rect x="40" y="242" width="80" height="36" class="gate-in"/>
  <text x="80" y="260" class="lbl">A</text>
  <ellipse cx="205" cy="225" rx="25" ry="18" class="gate-and"/>
  <text x="205" y="223" class="lbl" font-weight="bold">&amp;</text>
  <text x="205" y="235" class="sublbl">#5</text>
  <rect x="320" y="139" width="80" height="32" class="gate-out"/>
