<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 335" width="640" height="335">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #111827; }
      .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #1f2937; dominant-baseline: central; text-anchor: middle; }
      .sublbl { font-family: system-ui, -apple-system, sans-serif; font-size: 8px; fill: #6b7280; text-anchor: middle; }
      .gate-and { fill: #ffffff; stroke: #374151; stroke-width: 1.5; }
      .gate-in { fill: #e1f5fe; stroke: #0288d1; stroke-width: 1.5; rx: 6px; }
      .gate-const { fill: #eeeeee; stroke: #757575; stroke-width: 1.5; }
      .gate-out { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 1.5; rx: 6px; }
      .wire { fill: none; stroke: #374151; stroke-width: 1.75; stroke-linecap: round; }
      .wire-inv { fill: none; stroke: #d32f2f; stroke-width: 1.75; stroke-linecap: round; }
      .bubble { fill: #ffffff; stroke: #d32f2f; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fafafa" rx="8"/>
  <text x="40" y="50" class="title">Constructive SR Latch - Before Unrolling</text>
  <path d="M 120 190 C 147 190, 145 182.8, 172 182.8" class="wire-inv"/>
  <circle cx="176" cy="182.8" r="3.5" class="bubble"/>
  <path d="M 120 260 C 147 260, 153 197.2, 180 197.2" class="wire"/>
  <path d="M 120 120 C 210 120, 222 182.8, 312 182.8" class="wire-inv"/>
  <circle cx="316" cy="182.8" r="3.5" class="bubble"/>
  <path d="M 230 190 C 270.5 190, 271.5 197.2, 312 197.2" class="wire-inv"/>
  <circle cx="316" cy="197.2" r="3.5" class="bubble"/>
  <path d="M 370 190 C 410.5 190, 411.5 190, 452 190" class="wire-inv"/>
  <circle cx="456" cy="190" r="3.5" class="bubble"/>
  <rect x="40" y="102" width="80" height="36" class="gate-in"/>
  <text x="80" y="120" class="lbl">Set</text>
  <rect x="40" y="172" width="80" height="36" class="gate-in"/>
  <text x="80" y="190" class="lbl">Reset</text>
  <rect x="40" y="242" width="80" height="36" class="gate-in"/>
  <text x="80" y="260" class="lbl">Q</text>
  <ellipse cx="205" cy="190" rx="25" ry="18" class="gate-and"/>
  <text x="205" y="188" class="lbl" font-weight="bold">&amp;</text>
  <text x="205" y="200" class="sublbl">#4</text>
  <ellipse cx="345" cy="190" rx="25" ry="18" class="gate-and"/>
  <text x="345" y="188" class="lbl" font-weight="bold">&amp;</text>
  <text x="345" y="200" class="sublbl">#5</text>
  <rect x="460" y="174" width="80" height="32" class="gate-out"/>
  <text x="500" y="190" class="lbl">out[0]</text>
